name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x
            - run: deno task fmt --check
            - run: deno lint
            - run: deno check src/**/*.ts tests/**/*.ts
            - run: deno test --allow-read=.agents/skills,docs
